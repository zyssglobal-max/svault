<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVault | Security Blog</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --surface: #0a0a0a;
            --accent: #00e0a4;
            --accent-glow: rgba(0, 224, 164, 0.4);
            --text: #e0e0e0;
            --text-dim: #8a8a8a;
            --danger: #ff4d6a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Share Tech Mono', monospace;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        /* Efecto de línea de escaneo (Scanline) */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        /* Contenedor principal */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* Encabezado con efecto Glitch */
        header {
            text-align: center;
            margin-bottom: 60px;
            padding-bottom: 30px;
            border-bottom: 1px solid rgba(0, 224, 164, 0.2);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        h1::before, h1::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
        }

        h1::before {
            left: 2px;
            text-shadow: -2px 0 var(--danger);
            clip: rect(24px, 550px, 90px, 0);
            animation: glitch-anim 3s infinite linear alternate-reverse;
        }

        h1::after {
            left: -2px;
            text-shadow: -2px 0 var(--accent);
            clip: rect(85px, 550px, 140px, 0);
            animation: glitch-anim 2.5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim {
            0% { clip: rect(10px, 9999px, 31px, 0); }
            20% { clip: rect(65px, 9999px, 89px, 0); }
            40% { clip: rect(22px, 9999px, 15px, 0); }
            60% { clip: rect(90px, 9999px, 95px, 0); }
            80% { clip: rect(45px, 9999px, 60px, 0); }
            100% { clip: rect(12px, 9999px, 80px, 0); }
        }

        .subtitle {
            color: var(--accent);
            font-size: 1.1rem;
            margin-top: 10px;
            letter-spacing: 2px;
        }

        .subtitle::after {
            content: '█';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Tarjetas de artículos */
        .grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(0, 224, 164, 0.3);
            border-left: 4px solid var(--accent);
            border-radius: 4px;
            padding: 25px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card:hover {
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow), inset 0 0 20px rgba(0, 224, 164, 0.05);
            transform: translateY(-3px);
        }

        .card::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 224, 164, 0.1), transparent);
            transition: left 0.5s;
        }

        .card:hover::before { left: 100%; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .card h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            color: #fff;
            margin: 0;
        }

        .meta {
            font-size: 0.85rem;
            color: var(--text-dim);
            display: flex;
            gap: 15px;
        }

        .meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .category {
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .content {
            color: #c0c0c0;
            font-size: 1rem;
            line-height: 1.7;
        }

        .content h3 {
            color: var(--accent);
            font-size: 1.1rem;
            margin: 20px 0 10px 0;
            font-family: 'Orbitron', sans-serif;
        }

        .content p { margin-bottom: 12px; }
        .content ul { margin-left: 20px; margin-bottom: 12px; }
        .content li { margin-bottom: 5px; }
        .content code {
            background: rgba(0, 224, 164, 0.1);
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Share Tech Mono', monospace;
        }

        /* Mensajes de estado / error */
        .status-msg {
            text-align: center;
            padding: 40px;
            border: 1px dashed var(--danger);
            background: rgba(255, 77, 106, 0.05);
            border-radius: 4px;
            color: var(--danger);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--accent);
            font-size: 1.2rem;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .card-header { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1 data-text="SVAULT">SVAULT</h1>
            <div class="subtitle">> INICIALIZANDO PROTOCOLO DE SEGURIDAD...</div>
        </header>

        <main id="posts-container" class="grid">
            <div class="loading">[ ~ ] Conectando con la base de datos...</div>
        </main>
    </div>

    <script>
        // Función para leer y renderizar posts.json
        fetch('./posts.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Error HTTP: ${response.status}. ¿Existe el archivo posts.json?`);
                }
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('posts-container');
                container.innerHTML = ''; // Limpiar mensaje de carga

                // Aseguramos que sea un array (por si el JSON tiene un solo objeto)
                const posts = Array.isArray(data) ? data : [data];

                if (posts.length === 0) {
                    container.innerHTML = '<div class="status-msg">[ ! ] La base de datos está vacía.</div>';
                    return;
                }

                // Renderizar cada post con un ligero retraso para efecto de cascada
                posts.forEach((post, index) => {
                    const card = document.createElement('article');
                    card.className = 'card';
                    card.style.animationDelay = `${index * 0.1}s`; // Efecto cascada
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <h2>${post.titulo}</h2>
                            <div class="meta">
                                <span class="category">${post.categoria}</span>
                                <span>📅 ${post.fecha}</span>
                            </div>
                        </div>
                        <div class="content">${post.contenido}</div>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('posts-container').innerHTML = `
                    <div class="status-msg">
                        [ X ] ERROR DE CONEXIÓN<br><br>
                        <strong>${error.message}</strong><br><br>
                        <small style="color: var(--text-dim)">
                            1. Verifica que el archivo se llame exactamente <strong>posts.json</strong> (minúsculas).<br>
                            2. Asegúrate de que esté en la misma carpeta que index.html.<br>
                            3. El JSON debe empezar con <strong>[</strong> y terminar con <strong>]</strong>.
                        </small>
                    </div>
                `;
            });
    </script>
</body>
</html>
