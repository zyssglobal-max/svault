<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVault | Security Blog</title>
    <!-- Fuentes Profesionales -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #09090b;       /* Negro casi puro */
            --card-bg: #121214;  /* Gris muy oscuro */
            --border: #27272a;   /* Bordes sutiles */
            --accent: #00e0a4;   /* Tu verde neón */
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --glow: rgba(0, 224, 164, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* --- HEADER & BUSCADOR --- */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 20px 0;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Barra de búsqueda PRO */
        .search-wrapper {
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 99px; /* Redondo */
            padding: 10px 16px 10px 40px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--glow);
        }

        #searchInput::placeholder { color: var(--text-muted); }

        /* --- GRID DE ARTÍCULOS --- */
        main {
            padding: 40px 0;
            min-height: 80vh;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tag {
            color: var(--accent);
            background: rgba(0, 224, 164, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
            color: #fff;
        }

        .card-content {
            font-size: 0.95rem;
            color: var(--text-muted);
            flex-grow: 1;
        }

        /* Estilos dentro del contenido del post */
        .card-content h3 {
            color: var(--text-main);
            font-size: 1rem;
            margin: 16px 0 8px 0;
            font-weight: 600;
        }
        
        .card-content p { margin-bottom: 10px; }
        
        .card-content ul {
            padding-left: 20px;
            margin-bottom: 10px;
        }
        
        .card-content li { margin-bottom: 4px; }

        .card-content code {
            background: #27272a;
            color: var(--accent);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
        }

        /* Estados vacíos */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
        }

        @media (max-width: 600px) {
            .header-content { flex-direction: column; align-items: stretch; }
            .search-wrapper { max-width: 100%; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <div class="brand">
                <div class="logo-icon">SV</div>
                <h1>SecureVault Blog</h1>
            </div>
            
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="searchInput" placeholder="Buscar artículos de seguridad...">
            </div>
        </div>
    </header>

    <main class="container">
        <div id="posts-container" class="grid">
            <div class="loading">[ ~ ] Cargando base de conocimientos...</div>
        </div>
    </main>

    <script>
        // Lógica simple y robusta
        fetch('./posts.json')
            .then(response => {
                if (!response.ok) throw new Error("No se encontró posts.json");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('posts-container');
                const posts = Array.isArray(data) ? data : [data];
                
                // Función para renderizar
                function renderPosts(filterText = '') {
                    container.innerHTML = '';
                    
                    const filtered = posts.filter(post => {
                        const searchStr = (post.titulo + ' ' + post.categoria + ' ' + post.contenido).toLowerCase();
                        return searchStr.includes(filterText.toLowerCase());
                    });

                    if (filtered.length === 0) {
                        container.innerHTML = `<div class="empty-state">No se encontraron resultados para "${filterText}"</div>`;
                        return;
                    }

                    filtered.forEach(post => {
                        const card = document.createElement('article');
                        card.className = 'card';
                        card.innerHTML = `
                            <div class="card-meta">
                                <span class="tag">${post.categoria}</span>
                                <span>${post.fecha}</span>
                            </div>
                            <h2>${post.titulo}</h2>
                            <div class="card-content">${post.contenido}</div>
                        `;
                        container.appendChild(card);
                    });
                }

                // Render inicial
                renderPosts();

                // Evento de búsqueda
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    renderPosts(e.target.value);
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('posts-container').innerHTML = `
                    <div class="empty-state" style="color: #ff4d6a">
                        <strong>Error de conexión</strong><br>
                        Asegúrate de que el archivo <code>posts.json</code> existe y es válido.
                    </div>`;
            });
    </script>
</body>
</html>
