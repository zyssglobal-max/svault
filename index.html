<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVAULT | Seguridad Bestial</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0;
            font-family: 'Rajdhani', sans-serif;
            background-color: #050508;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 0, 128, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.15) 0%, transparent 25%);
            color: #e0e0e0;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }
        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            margin: 0;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(255, 0, 128, 0.8), 0 0 20px rgba(255, 0, 128, 0.5);
        }
        header p {
            font-size: 1.3rem;
            color: #00ffff;
            letter-spacing: 2px;
            margin-top: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.6);
        }
        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        article {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 0, 128, 0.3);
            border-radius: 16px;
            padding: 30px;
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
        }
        article:hover {
            transform: translateY(-5px);
            border-color: #00ffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.2);
        }
        article h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            margin: 0 0 10px 0;
            color: #fff;
        }
        .meta {
            display: flex;
            gap: 15px;
            font-size: 0.95rem;
            color: #ff0080;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }
        .content {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #c0c0c0;
        }
        .content h2, .content h3 { color: #00ffff; font-family: 'Orbitron', sans-serif; margin-top: 25px; }
        .status-msg {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
            font-family: 'Orbitron', sans-serif;
            border: 1px dashed #ff3333;
            background: rgba(255, 0, 0, 0.05);
            border-radius: 10px;
            color: #ff6666;
        }
        .status-msg small { display: block; margin-top: 15px; font-family: 'Rajdhani', sans-serif; color: #aaa; }
    </style>
</head>
<body>

    <header>
        <h1>SVAULT</h1>
        <p>// PROTEGE TU MUNDO DIGITAL //</p>
    </header>

    <main id="posts-container">
        <div class="status-msg">⏳ Conectando con la base de datos...</div>
    </main>

    <script>
        // Leemos el archivo posts.json
        fetch('posts.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`No se encontró el archivo (Error ${response.status}). Verifica que se llame exactamente "posts.json" (todo en minúsculas).`);
                }
                return response.json();
            })
            .then(data => {
                const contenedor = document.getElementById('posts-container');
                contenedor.innerHTML = ''; // Limpiar mensaje de carga

                // Si el usuario puso un solo objeto {} en lugar de una lista [], lo convertimos en lista para que no falle
                const posts = Array.isArray(data) ? data : [data];

                if (posts.length === 0) {
                    contenedor.innerHTML = '<div class="status-msg">⚠️ La base de datos está vacía.</div>';
                    return;
                }

                // Generamos cada artículo
                posts.forEach(post => {
                    const articulo = document.createElement('article');
                    articulo.innerHTML = `
                        <h2>${post.titulo}</h2>
                        <div class="meta">
                            <span>📅 ${post.fecha}</span>
                            <span>|</span>
                            <span>📁 ${post.categoria}</span>
                        </div>
                        <div class="content">${post.contenido}</div>
                    `;
                    contenedor.appendChild(articulo);
                });
            })
            .catch(error => {
                console.error('Error detallado:', error);
                document.getElementById('posts-container').innerHTML = `
                    <div class="status-msg">
                        ⚠️ ERROR AL LEER posts.json<br><br>
                        <strong>${error.message}</strong><br><br>
                        <small>
                            1. ¿El archivo se llama exactamente <strong>posts.json</strong> (minúsculas, sin espacios)?<br>
                            2. ¿Está en la <strong>misma carpeta</strong> que index.html?<br>
                            3. ¿El JSON es válido? Debe empezar con <strong>[</strong> y terminar con <strong>]</strong>.<br>
                            4. ¿Hiciste "Commit" de los cambios en GitHub?
                        </small>
                    </div>
                `;
            });
    </script>
</body>
</html>
