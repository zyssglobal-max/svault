<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVault | Security Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #09090b;
            --accent: #00e0a4;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --text-dim: #71717a;
            --glow: rgba(0, 224, 164, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* --- FONDO ANIMADO SUTIL --- */
        .bg-gradient {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 224, 164, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(0, 224, 164, 0.05) 0%, transparent 40%);
            pointer-events: none;
            z-index: 0;
            animation: gradientShift 15s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* --- HEADER FLOTANTE --- */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            background: rgba(9, 9, 11, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 18px 0;
            animation: slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-100%);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 32px;
            position: relative;
            z-index: 1;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 24px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #00b583);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            box-shadow: 0 0 30px var(--glow);
            animation: logoFloat 4s ease-in-out infinite;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* --- BOTÓN DE BÚSQUEDA --- */
        .search-toggle {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            color: var(--text-muted);
        }

        .search-toggle:hover {
            background: rgba(0, 224, 164, 0.1);
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(1.05);
        }

        .search-toggle.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #000;
        }

        .search-toggle svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s;
        }

        .search-toggle.active svg {
            transform: rotate(90deg);
        }

        /* --- OVERLAY DE BÚSQUEDA --- */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(9, 9, 11, 0.95);
            backdrop-filter: blur(20px);
            padding: 100px 0 40px;
            z-index: 99;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 32px;
            transform: translateY(-20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .search-overlay.active .search-container {
            transform: translateY(0);
        }

        .search-input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .search-input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--accent);
            pointer-events: none;
        }

        #searchInput {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(0, 224, 164, 0.3);
            border-radius: 16px;
            padding: 18px 24px 18px 56px;
            color: var(--text-main);
            font-size: 1.1rem;
            outline: none;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        #searchInput:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--glow);
        }

        #searchInput::placeholder {
            color: var(--text-dim);
        }

        .search-hint {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 0.05em;
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 140px 0 80px;
            text-align: center;
            animation: fadeInUp 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-tagline {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .hero h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #fff 0%, rgba(255, 255, 255, 0.7) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.7;
        }

        /* --- ARTÍCULOS (SIN CAJAS) --- */
        main {
            padding: 40px 0 100px;
        }

        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        article {
            opacity: 0;
            animation: articleReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes articleReveal {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .article-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .article-category {
            color: var(--accent);
            position: relative;
            padding-left: 24px;
        }

        .article-category::before {
            content: "";
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 16px;
            height: 2px;
            background: var(--accent);
        }

        .article-date {
            opacity: 0.7;
        }

        article h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 28px;
            color: #fff;
            transition: color 0.3s;
            cursor: pointer;
        }

        article h2:hover {
            color: var(--accent);
        }

        .article-content {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.9;
        }

        .article-content h3 {
            font-family: 'Inter', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
            margin: 40px 0 16px 0;
            line-height: 1.3;
        }

        .article-content p {
            margin-bottom: 20px;
        }

        .article-content ul {
            margin: 20px 0;
            padding-left: 0;
            list-style: none;
        }

        .article-content li {
            margin-bottom: 12px;
            padding-left: 28px;
            position: relative;
        }

        .article-content li::before {
            content: "→";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 600;
        }

        .article-content strong {
            color: var(--text-main);
            font-weight: 600;
        }

        .article-content code {
            background: rgba(0, 224, 164, 0.1);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
            border: 1px solid rgba(0, 224, 164, 0.2);
        }

        /* Separador entre artículos */
        article:not(:last-child)::after {
            content: "";
            display: block;
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 80px auto 0;
        }

        /* Estados */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-dim);
            font-size: 1.1rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .loading {
            text-align: center;
            padding: 80px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--accent);
            font-size: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container { padding: 0 20px; }
            .hero { padding: 120px 0 60px; }
            .posts-list { gap: 60px; }
            article h2 { font-size: 1.8rem; }
            .search-container { padding: 0 20px; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient"></div>

    <header>
        <div class="container header-content">
            <div class="brand">
                <div class="logo-icon">SV</div>
                <h1>SecureVault</h1>
            </div>
            
            <button class="search-toggle" id="searchToggle" aria-label="Buscar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Overlay de búsqueda -->
    <div class="search-overlay" id="searchOverlay">
        <div class="search-container">
            <div class="search-input-wrapper">
                <svg class="search-input-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="text" id="searchInput" placeholder="Buscar artículos de seguridad..." autocomplete="off">
            </div>
            <div class="search-hint">Presiona ESC para cerrar</div>
        </div>
    </div>

    <div class="container">
        <section class="hero">
            <div class="hero-tagline">// Blog de Seguridad Digital</div>
            <h2>Protege tu mundo digital</h2>
            <p>Guías prácticas y consejos esenciales para mantener tus datos seguros en la era digital.</p>
        </section>
    </div>

    <main class="container">
        <div id="posts-container" class="posts-list">
            <div class="loading">[ ~ ] Cargando artículos...</div>
        </div>
    </main>

    <script>
        // Lógica de búsqueda
        const searchToggle = document.getElementById('searchToggle');
        const searchOverlay = document.getElementById('searchOverlay');
        const searchInput = document.getElementById('searchInput');

        // Abrir/cerrar búsqueda
        searchToggle.addEventListener('click', () => {
            const isActive = searchOverlay.classList.contains('active');
            
            if (isActive) {
                closeSearch();
            } else {
                openSearch();
            }
        });

        function openSearch() {
            searchOverlay.classList.add('active');
            searchToggle.classList.add('active');
            setTimeout(() => searchInput.focus(), 300);
        }

        function closeSearch() {
            searchOverlay.classList.remove('active');
            searchToggle.classList.remove('active');
            searchInput.value = '';
            renderPosts(''); // Resetear búsqueda
        }

        // Cerrar con ESC
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && searchOverlay.classList.contains('active')) {
                closeSearch();
            }
        });

        // Cargar y renderizar posts
        fetch('./posts.json')
            .then(response => {
                if (!response.ok) throw new Error("No se encontró posts.json");
                return response.json();
            })
            .then(data => {
                const container = document.getElementById('posts-container');
                const posts = Array.isArray(data) ? data : [data];
                
                function renderPosts(filterText = '') {
                    const filtered = posts.filter(post => {
                        const searchStr = (post.titulo + ' ' + post.categoria + ' ' + post.contenido).toLowerCase();
                        return searchStr.includes(filterText.toLowerCase());
                    });

                    if (filtered.length === 0) {
                        container.innerHTML = `<div class="empty-state">No se encontraron resultados para "${filterText}"</div>`;
                        return;
                    }

                    container.innerHTML = '';
                    
                    filtered.forEach((post, index) => {
                        const article = document.createElement('article');
                        article.style.animationDelay = `${index * 0.15}s`;
                        
                        article.innerHTML = `
                            <div class="article-meta">
                                <span class="article-category">${post.categoria}</span>
                                <span class="article-date">${post.fecha}</span>
                            </div>
                            <h2>${post.titulo}</h2>
                            <div class="article-content">${post.contenido}</div>
                        `;
                        container.appendChild(article);
                    });
                }

                // Hacer renderPosts disponible globalmente
                window.renderPosts = renderPosts;
                renderPosts();

                // Búsqueda en tiempo real
                let searchTimeout;
                searchInput.addEventListener('input', (e) => {
                    clearTimeout(searchTimeout);
                    searchTimeout = setTimeout(() => {
                        renderPosts(e.target.value);
                    }, 300);
                });
            })
            .catch(error => {
                console.error(error);
                document.getElementById('posts-container').innerHTML = `
                    <div class="empty-state" style="color: #ff4d6a">
                        <strong>Error de conexión</strong><br>
                        Verifica que el archivo posts.json existe.
                    </div>`;
            });
    </script>
</body>
</html>
