name: Nuevo Articulo
description: Agrega un nuevo post al blog de forma segura
title: "POST: Escribe el titulo aqui"
labels:
  - post
body:
  - type: input
    id: categoria
    attributes:
      label: Categoria
      description: Ejemplo, SEGURIDAD, PRIVACIDAD, TUTORIAL
      placeholder: SEGURIDAD
    validations:
      required: true
  - type: input
    id: fecha
    attributes:
      label: Fecha
      description: Ejemplo, 25 OCT 2026
      placeholder: 25 OCT 2026
    validations:
      required: true
  - type: textarea
    id: contenido
    attributes:
      label: Contenido del Articulo
      description: Puedes usar HTML basico como h3, p, strong, ul, li
      placeholder: Escribe aqui el contenido de tu articulo
      render: markdown
    validations:
      required: true
