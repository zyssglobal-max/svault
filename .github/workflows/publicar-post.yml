name: Publicar Post desde Issue

on:
  issues:
    types: [opened]

jobs:
  publicar:
    if: contains(github.event.issue.labels.*.name, 'post')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: DEBUG - Mostrar datos del issue
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          echo "=========================================="
          echo "🔍 DEBUG INFO"
          echo "=========================================="
          echo "TITLE: $TITLE"
          echo ""
          echo "BODY COMPLETO:"
          echo "$BODY"
          echo ""
          echo "=========================================="
          echo "BODY EN HEX (para ver caracteres ocultos):"
          echo "$BODY" | head -c 1000 | xxd | head -30
          echo "=========================================="

      - name: Procesar con Node.js
        run: |
          cat > process.js << 'EOF'
          const fs = require('fs');
          
          try {
            const title = process.env.TITLE.replace(/^POST:\s*/i, '').trim();
            const body = process.env.BODY;
            
            console.log('📝 Título extraído:', title);
            console.log('📄 Body length:', body.length);
            console.log('📄 Body (primeros 800 chars):');
            console.log(body.substring(0, 800));
            console.log('---');
            
            // Función mejorada para extraer campos
            function extractField(body, fieldName) {
              // Patrón 1: ### Campo\n\nvalor (con doble salto)
              const pattern1 = new RegExp(`###\\s+${fieldName}\\s*\\r?\\n\\r?\\n([\\s\\S]*?)(?=\\r?\\n###|$)`, 'i');
              // Patrón 2: ### Campo\nvalor (con salto simple)
              const pattern2 = new RegExp(`###\\s+${fieldName}\\s*\\r?\\n([\\s\\S]*?)(?=\\r?\\n###|\\r?\\n\\r?\\n|$)`, 'i');
              // Patrón 3: Campo\n\nvalor (sin ###)
              const pattern3 = new RegExp(`${fieldName}\\s*\\r?\\n\\r?\\n([\\s\\S]*?)(?=\\r?\\n\\w|\\r?\\n\\r?\\n|$)`, 'i');
              
              for (const pattern of [pattern1, pattern2, pattern3]) {
                const match = body.match(pattern);
                if (match && match[1]) {
                  const value = match[1].trim().replace(/^_No response_$/gm, '').trim();
                  if (value) {
                    console.log(`✅ Campo "${fieldName}" encontrado con patrón exitoso`);
                    return value;
                  }
                }
              }
              console.log(`⚠️  Campo "${fieldName}" NO encontrado`);
              return '';
            }
            
            const categoria = extractField(body, 'Categoria') || 'GENERAL';
            const fecha = extractField(body, 'Fecha') || new Date().toLocaleDateString('es-ES', { 
              day: 'numeric', month: 'short', year: 'numeric' 
            }).toUpperCase().replace('.', '');
            const contenido = extractField(body, 'Contenido del Articulo');
            
            console.log('');
            console.log('🏷️  Categoría:', categoria);
            console.log('📅 Fecha:', fecha);
            console.log('📝 Contenido:', contenido.substring(0, 200));
            console.log('');
            
            if (!title || !contenido) {
              console.error('❌ FALTAN DATOS OBLIGATORIOS');
              console.error('Título:', title ? 'OK' : 'FALTA');
              console.error('Contenido:', contenido ? 'OK' : 'FALTA');
              process.exit(1);
            }
            
            // Leer posts.json
            let posts = [];
            if (fs.existsSync('posts.json')) {
              try {
                const raw = fs.readFileSync('posts.json', 'utf8');
                posts = JSON.parse(raw);
                if (!Array.isArray(posts)) posts = [posts];
                console.log('✅ Posts existentes:', posts.length);
              } catch (e) {
                console.log('⚠️  Error leyendo posts.json:', e.message);
                posts = [];
              }
            } else {
              console.log('⚠️  posts.json no existe, creando nuevo');
            }
            
            // Crear nuevo post
            const nuevoPost = {
              titulo: title,
              categoria: categoria.toUpperCase(),
              fecha: fecha,
              contenido: contenido
            };
            
            console.log('📦 Nuevo post a agregar:', JSON.stringify(nuevoPost, null, 2));
            
            posts.unshift(nuevoPost);
            
            // Guardar
            const jsonOutput = JSON.stringify(posts, null, 2);
            fs.writeFileSync('posts.json', jsonOutput, 'utf8');
            console.log('✅ Post agregado correctamente');
            console.log('📄 Nuevo posts.json (primeros 500 chars):');
            console.log(jsonOutput.substring(0, 500));
            
          } catch (error) {
            console.error('❌ ERROR CRÍTICO:', error.message);
            console.error(error.stack);
            process.exit(1);
          }
          EOF
          
          node process.js
        env:
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}

      - name: Verificar cambios
        run: |
          echo "📋 Estado de Git:"
          git status
          echo ""
          echo "📋 Diferencias:"
          git diff posts.json || echo "No hay diferencias"

      - name: Commit y Push
        run: |
          git add posts.json
          if git diff --staged --quiet; then
            echo "⚠️  No hay cambios para commitear"
            exit 1
          else
            git commit -m "🚀 Nuevo post desde issue"
            git push
            echo "✅ Push exitoso"
          fi

      - name: Cerrar Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "✅ **Post publicado exitosamente!** 🎉\n\nTu artículo ya está en vivo en el blog."
